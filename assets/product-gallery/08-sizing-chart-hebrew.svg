<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">מדריך מידות לכפפות MyBambook</title>
  <desc id="desc">מדדו סביב מפרקי האצבעות. מידה S מתאימה ל־15 עד 18 סנטימטר, מידה M ל־18 עד 20 סנטימטר, ומידה L ל־20 עד 23 סנטימטר.</desc>
  <rect width="1080" height="1080" fill="#FBFDFB"/>
  <rect x="0" y="0" width="1080" height="350" fill="#FBFDFB"/>

  <g transform="translate(76,72) scale(0.82)">
    <path d="M91 282c-16 0-29-13-29-29v-90c0-16 13-29 29-29s29 13 29 29v36h18V72c0-17 13-30 30-30s30 13 30 30v127h18V46c0-17 13-30 30-30s30 13 30 30v153h18V78c0-17 13-30 30-30s30 13 30 30v142l52-51c12-12 31-12 43 0s12 31 0 43L319 342c-20 20-47 31-75 31h-56c-54 0-97-37-97-91z" fill="#9BC9C2"/>
    <path d="M202 238h-94v-45h221v45H202z" fill="#FBFDFB" stroke="#1F1F1F" stroke-width="2"/>
