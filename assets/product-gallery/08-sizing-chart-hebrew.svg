    <text x="218" y="225" font-family="Heebo, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="middle" fill="#1F1F1F">מדידה</text>
  </g>

  <g font-family="Heebo, Arial, sans-serif" direction="rtl" unicode-bidi="plaintext" text-anchor="middle">
    <text x="782" y="145" font-size="58" font-weight="900" fill="#102536">מדדו סביב</text>
    <text x="782" y="216" font-size="58" font-weight="900" fill="#102536">מפרקי האצבעות</text>
    <text x="782" y="264" font-size="24" font-weight="700" fill="#5A6F78">הקיפו את החלק הרחב של פרקי האצבעות</text>
    <text x="782" y="299" font-size="24" font-weight="700" fill="#5A6F78">בלי האגודל</text>
  </g>

  <rect x="0" y="398" width="1080" height="160" fill="#191919"/>
  <g stroke="#7D7D7D" stroke-width="2">
    <line x1="0" y1="398" x2="1080" y2="398"/>
    <line x1="0" y1="558" x2="1080" y2="558"/>
    <line x1="0" y1="732" x2="1080" y2="732"/>
    <line x1="0" y1="906" x2="1080" y2="906"/>
    <line x1="0" y1="1036" x2="1080" y2="1036"/>
    <line x1="360" y1="398" x2="360" y2="1036"/>
    <line x1="720" y1="398" x2="720" y2="1036"/>
  </g>

  <g font-family="Heebo, Arial, sans-serif" text-anchor="middle">
    <g fill="#FBFDFB" direction="rtl" unicode-bidi="plaintext">
      <text x="900" y="474" font-size="47" font-weight="900">מידה</text>
      <text x="900" y="519" font-size="24" font-weight="700">כפפות MyBambook</text>

      <text x="540" y="474" font-size="47" font-weight="900">ס״מ</text>
      <text x="540" y="519" font-size="24" font-weight="700">היקף מפרקי האצבעות</text>

      <text x="180" y="474" font-size="47" font-weight="900">אינץ׳</text>
      <text x="180" y="519" font-size="24" font-weight="700">מדידה מקבילה</text>
    </g>

    <g fill="#181818" font-size="58" font-weight="900">
      <text x="900" y="662">S</text>
      <text x="540" y="662">15–18</text>
      <text x="180" y="662">5.9–7.0</text>

      <text x="900" y="836">M</text>
      <text x="540" y="836">18–20</text>
      <text x="180" y="836">7.0–7.8</text>

      <text x="900" y="984">L</text>
      <text x="540" y="984">20–23</text>
      <text x="180" y="984">7.8–9.0</text>
    </g>

    <text x="540" y="1063" font-family="Heebo, Arial, sans-serif" font-size="24" font-weight="800" fill="#102536" direction="rtl" unicode-bidi="plaintext">אם אתם בין מידות — בחרו לפי תחושת הלחיצה הרצויה</text>
